[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyvizion"
version = "1.0.8"
description = "Biblioteca Python para automação de interface por imagem e texto."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Josias Azevedo da Silva" }]
keywords = [
    "rpa", "automation", "gui-automation", "ocr", "tesseract", "opencv",
    "template-matching", "computer-vision", "legacy-systems", "oracle-forms",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python-headless>=4.5",
    "numpy>=1.21",
    "Pillow>=9.0",
    "pyautogui>=0.9.53",
    "pytesseract>=0.3.8",
    "pyperclip>=1.8",
    "mss>=9.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://pypi.org/project/pyvizion/"
Documentation = "https://pypi.org/project/pyvizion/"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
pyvizion = "pyvizion.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyvizion"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"src/pyvizion/__init__.py" = ["E402"]
